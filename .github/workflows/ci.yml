name: Audit Suite

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  audit-and-benchmarks:
    name: Audit & Benchmarks (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pytest fastapi uvicorn httpx structlog pillow
          pip install -e python/

      - name: Build Web UI Dashboard Bundle
        working-directory: ui/web
        run: |
          npm install
          npm run build

      - name: Run Master Audit Suite (Sections 1–8)
        run: |
          python tests/audit_suite.py
        env:
          PYTHONPATH: python

      - name: Run CLI Innovations Benchmark
        run: |
          python python/phantom/phantom_cli.py benchmark
        env:
          PYTHONPATH: python

      - name: Run Standalone Benchmarks
        run: |
          python tests/benchmarks/bench_spectral_quant.py
          python tests/benchmarks/bench_wraith_prefetch.py
          python tests/benchmarks/bench_neural_cache.py
          python tests/benchmarks/bench_sparse_routing.py
          python tests/benchmarks/bench_phantom_pages.py
          python tests/benchmarks/bench_chronos.py
          python tests/benchmarks/bench_full_pipeline.py
          python tests/benchmarks/bench_calibration.py
        env:
          PYTHONPATH: python
