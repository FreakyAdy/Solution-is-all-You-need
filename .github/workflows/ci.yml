name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  cpu-verification-gate:
    name: CPU CI Gate (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pytest fastapi uvicorn httpx structlog pillow rich pyyaml psutil
          pip install -e python/

      - name: Run Numerical Reference Parity Gate (CPU)
        run: |
          python tests/correctness/test_reference_parity.py --quick
        env:
          PYTHONPATH: python

      - name: Run Quantitative Claims Consistency Gate
        run: |
          python scripts/check_claims.py

      - name: Verify RESULTS.md Sync with latest.json
        run: |
          python scripts/generate_results.py --check

      - name: Run Unit Tests
        run: |
          python -m pytest tests/unit/
        env:
          PYTHONPATH: python
