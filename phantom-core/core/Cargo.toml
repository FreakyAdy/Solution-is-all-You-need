[package]
name = "phantom-core"
version = "0.1.0"
edition = "2021"
authors = ["PHANTOM CORE Project"]
description = "Universal Hardware-Transcendent LLM Inference Engine"
license = "MIT"
readme = "../README.md"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rmp-serde = "1.1"          # MessagePack for binary state

# Compression
lz4_flex = "0.11"          # LZ4 compression for NVMe pages

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# CLI
clap = { version = "4.4", features = ["derive"] }

# CUDA FFI
cuda-runtime-sys = "0.3"

# Python interop
pyo3 = { version = "0.20", features = ["auto-initialize"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Metrics
sysinfo = "0.30"           # System info (RAM, CPU)
nvml-wrapper = "0.9"       # NVIDIA GPU monitoring (temp, power, throttle)

# IPC
interprocess = "2.0"       # Cross-platform named pipes / unix sockets

# Async channels
async-channel = "2.1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Byte utilities
byteorder = "1.5"
bytes = "1.5"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.9"
rand = "0.8"

[build-dependencies]
cc = "1.0"

[[bin]]
name = "phantom-core"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
